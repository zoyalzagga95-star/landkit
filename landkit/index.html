<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="./tailwind.js"></script>
    <!-- <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <style>
        .switch {
            position: relative;
            display: inline-block;
            width: 55px;
            height: 28px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background-color: #ccc;
            border-radius: 30px;
            transition: 0.4s;
        }

        .slider::before {
            content: "";
            position: absolute;
            height: 20px;
            width: 20px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            border-radius: 50%;
            transition: 0.4s;
        }

        input :checked+.slider {
            background-color: #2196f3;
        }

        input :checked+.slider::before {
            transform: translateX(27px);
        }

        .text-container {
            display: flex;
            gap: 8px;
            font-size: 30px;
            font-weight: normal;
        }

        .changing-text {
            height: 40px;
            overflow: hidden;
            color: #21f391;
        }

        .changing-text span {
            display: block;
            height: 40px;
            animation: changetext 8s infinite;
        }

        @keyframes changing-text {

            0%,
            20% {
                transform: translateY(-40px);
            }

            50%,
            70% {
                transform: translateY(-80px);
            }
        }
    </style>
</head>

<body>

    <div class="min-h-screen bg-[url('./assignment/image/wall.jpeg')] bg-center bg-cover px-28 py-5 relative  bg-black/55 ">

            <ul class=" text-white flex flex-row  px-2 ">

                <li><a class="px-5" href="">About</a></li>
                <li><a class="px-5" href="">Features</a></li>
                <li><a class="px-5" href="">Contacts</a></li>
            </ul>
            <img src="./assignment/image/lock.jpeg" class="w-8 cursor-pointer">
        </nav>



        <div class="text-white mt-48 max-w-lg animate__animated animate__slideInLeft animate__delay-2s	 ">

                    mins</span> </h1>
